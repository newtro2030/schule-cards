<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" font-family="Helvetica, Arial, sans-serif">
  <rect width="600" height="340" rx="18" fill="#12121f"/>
  <text x="300" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#f1f5f9">Der Kreis</text>
  <circle cx="170" cy="190" r="120" fill="none" stroke="#f1f5f9" stroke-width="3"/>
  <line x1="50" y1="190" x2="290" y2="190" stroke="#06b6d4" stroke-width="4"/>
  <line x1="170" y1="190" x2="255" y2="105" stroke="#a78bfa" stroke-width="4"/>
  <circle cx="170" cy="190" r="6" fill="#f59e0b"/>
  <text x="160" y="218" font-size="20" font-weight="700" fill="#f59e0b">M</text>
  <text x="226" y="166" font-size="20" font-weight="700" fill="#a78bfa">r</text>
  <text x="70" y="180" font-size="20" font-weight="700" fill="#06b6d4">d</text>
  <g font-size="17">
    <text x="330" y="110" fill="#f59e0b" font-weight="700">M = Mittelpunkt</text>
    <text x="330" y="132" fill="#94a3b8" font-size="14">alle Punkte der Kreislinie sind</text><text x="330" y="150" fill="#94a3b8" font-size="14">gleich weit von M entfernt</text>
    <text x="330" y="185" fill="#a78bfa" font-weight="700">r = Radius</text>
    <text x="330" y="207" fill="#94a3b8" font-size="14">vom Mittelpunkt bis zur Kreislinie</text>
    <text x="330" y="240" fill="#06b6d4" font-weight="700">d = Durchmesser</text>
    <text x="330" y="262" fill="#94a3b8" font-size="14">quer durch den Mittelpunkt</text>
    <text x="330" y="300" fill="#f1f5f9" font-weight="700" font-size="20">d = 2 · r</text>
  </g>
</svg>
